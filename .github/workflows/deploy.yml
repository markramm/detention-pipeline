name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        # Pillow renders the og:image social-preview cards (see
        # "Generate social-preview images" below).
        run: pip install pyyaml pytest pillow

      - name: Run unit tests
        run: python3 -m pytest kb/scripts/tests/ hugo/tests/ -q

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate heat scores
        run: ./build.sh

      - name: Generate Hugo content
        run: |
          cd hugo
          python3 generate_content.py

      - name: Generate social-preview images
        # og:image cards for every county/fight/player/state/blog page.
        # Must run after generate_content.py (reads content/fights,
        # content/players, content/blog) and before the Hugo build (writes
        # into static/og/, which Hugo copies verbatim into publishDir).
        # --top overrides the script's default of only the top 50 counties
        # by score; without it most of the 2,032 county pages would still
        # 404 on their og:image. Menlo/Helvetica aren't installed on the
        # Ubuntu runner, so PIL falls back to its default bitmap font here
        # (cards still render, just not with the local-build typography).
        run: |
          cd hugo
          python3 generate_og_cards.py --top 9999

      - name: Generate visualization data
        # network.json and timeline.json are gitignored (generated), and the
        # network/timeline pages fetch them client-side from the site root.
        # Without this step they 404 on the deployed site and the viz is blank.
        run: |
          cd hugo
          python3 generate_network.py
          python3 scripts/generate_timeline.py
          cp data/timeline.json static/timeline.json

      - name: Generate sitemap
        # Sitemap index + per-section sitemaps with real lastmod, replacing
        # Hugo's own flat sitemap.xml (disabled via disableKinds in
        # hugo.toml). Must run after generate_content.py (reads content/)
        # and before the Hugo build (writes into static/, which Hugo
        # copies verbatim into publishDir).
        run: |
          cd hugo
          python3 generate_sitemap.py

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Chicago
        run: |
          cd hugo
          hugo \
            --gc \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
