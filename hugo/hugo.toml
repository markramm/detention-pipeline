baseURL = "https://detention-pipeline.transparencycascade.org/"
languageCode = "en-us"
title = "Detention Pipeline"
publishDir = "../docs"

# Hugo's own flat sitemap.xml is disabled — generate_sitemap.py writes a
# sitemap index + per-section sitemaps into static/ instead (real
# per-page lastmod, split by section so Google can prioritize re-crawls).
# Run it after generate_content.py and before `hugo build`. robots.txt
# still points at /sitemap.xml, which is now the index file.
disableKinds = ["sitemap"]

[params]
  description = "Early-warning system for ICE detention facility expansion"
  repoURL = "https://github.com/markramm/detention-pipeline"
  kbPath = "kb"

[taxonomies]
  signal = "signals"
  state = "states"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
